[project]
name = "todo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.143.2",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
todo = "todo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly.errors]
unknown-name = false
missing-import = false
parse-error = false

