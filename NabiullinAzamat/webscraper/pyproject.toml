[project]
name = "webscraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tamplierS1", email = "azamat.nabiullin.97@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "trafilatura[all]>=2.2.0",
]

[project.scripts]
webscraper = "webscraper:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pyrefly.errors]
unknown-name = false
missing-import = false
parse-error = false

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.9",
]
