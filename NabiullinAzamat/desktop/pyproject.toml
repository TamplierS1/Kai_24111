[project]
name = "desktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tamplierS1", email = "azamat.nabiullin.97@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
desktop = "desktop:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pyrefly.errors]
unknown-name = false
missing-import = false
parse-error = false
