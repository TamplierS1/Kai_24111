[project]
name = "linkcut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tamplierS1", email = "azamat.nabiullin.97@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.143.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
linkcut = "linkcut:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pyrefly.errors]
unknown-name = false
missing-import = false
parse-error = false
